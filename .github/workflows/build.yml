name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 12.18.0
        run_install: false

    - name: Use Node.js 26
      uses: actions/setup-node@v4
      with:
        node-version: '26'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Quality gates
      run: pnpm build:content && pnpm typecheck && pnpm lint && pnpm test

    - name: Build static site
      run: pnpm build

    - name: Verify EdgeOne deployment readiness
      run: pnpm check:edgeone

    - name: Prepare Release Artifact
      run: |
        mkdir -p release/scripts release/services
        cp package.json pnpm-lock.yaml pnpm-workspace.yaml Dockerfile edgeone.json release/
        cp scripts/serve.mjs release/scripts/serve.mjs
        cp -r dist release/
        cp services/posts.json release/services/posts.json

    - name: Zip Release
      run: |
        cd release
        zip -r ../release.zip .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: release.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: release.zip

    - name: Update Latest Tag
      if: github.ref == 'refs/heads/main'
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        git tag -f latest
        git push -f origin latest

    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: latest
        name: Latest Build
        files: release.zip
        draft: false
        prerelease: false
